name: Build AgentX Multi-Platform

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: arm64,  bin: agentx-linux-arm64 }
          - { os: linux, arch: amd64,  bin: agentx-linux-amd64 }
          - { os: darwin, arch: arm64, bin: agentx-darwin-arm64 }
          - { os: darwin, arch: amd64, bin: agentx-darwin-amd64 }
          - { os: windows, arch: amd64, bin: agentx-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.bin }} ./cmd/agentx
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}

  release:
    permissions:
      contents: write
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" release/$(basename "$f")
          done
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
